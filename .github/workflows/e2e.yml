name: E2E

# Playwright on Chromium and WebKit, desktop and phone (starter pack playwright-e2e recipe,
# container variant: WebKit needs system libraries the plain runner lacks).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Match this tag exactly to @playwright/test in apps/playground/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/playground/playwright-report
          retention-days: 7
